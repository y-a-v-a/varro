# LATIN-XXV — the flagship: all of Latin, then Rome.
#
# WHY EPOCHS AND NOT STEPS
#   A step count is meaningless the moment the corpus changes. "74,700 steps"
#   was four passes over a 153M-token corpus; on a corpus half again as large
#   the same number is 2.7 passes, and the model is undertrained without
#   anything saying so. Epochs mean the same thing at any corpus size, which
#   is the whole point of a recipe you can re-run as the corpus grows.
#   train.py derives steps from epochs x corpus size / tokens-per-step.
#
# WHY BATCH 16
#   Not a quality choice. Throughput at this size is bounded by activation
#   memory, and on a 16GB machine batch 32 x context 512 does not degrade, it
#   collapses — 13x slower per token, because the working set stops fitting.
#   Measured 8, 16 and 24 all within 8% of each other; 16 is peak speed with
#   headroom. On a larger machine this should be re-measured, not assumed.

name: latin-xxv
description: 27.49M parameters, two phases, trained on Latin alone.

defaults:
  vocab: 4000
  dim: 512
  layers: 8
  heads: 8
  context: 512
  batch: 16
  eval_every: 500
  checkpoint_every: 1000
  period_tags: true

phases:
  # Latinitas — learn the language from all fifteen centuries of it.
  - name: latin-xxv-latinitas
    corpus: corpus
    epochs: 4.0          # the line past which repeated data stops paying
    lr: 2.5e-4
    warmup: 1000

  # Romanitas — narrow onto Rome. Short: adapting register inside a language
  # already known is far cheaper than learning the language. Optimizer state
  # is deliberately NOT carried over; a phase change wants a fresh schedule.
  #
  # NOTE the confound feasibility.md records: classical.train is a SUBSET of
  # corpus.train, so phase 1 already contained every token of phase 2. This
  # is "read everything including Rome, then read Rome again", not transfer.
  - name: latin-xxv
    corpus: classical
    init_from: latin-xxv-latinitas
    epochs: 3.0
    lr: 1.0e-4
    warmup: 100
    eval_every: 250
