# LATIN-LII — stage two: all the Latin there is, era-tagged, then Rome.
#
# WHAT MAKES IT DIFFERENT FROM LATIN-XXV
#   Not size. LATIN-XXV trains on Track A and narrows onto classical, and its
#   own comment records the confound: classical.train is a SUBSET of
#   corpus.train, so phase two re-reads text phase one already contained.
#   That is "read Rome again", not transfer, and the phase boundary earns
#   little.
#
#   Here phase one trains on corpus-b — Track A plus the amber, NonCommercial
#   sources — so the annealing phase narrows from a corpus that is broader in
#   licence as well as in period. The confound is not eliminated (classical is
#   still a subset) but the ratio it narrows from is far larger.
#
# THE LICENCE THIS MODEL CARRIES
#   corpus-b contains NonCommercial material. These weights are research-only
#   and cannot be released for commercial use. LATIN-VII exists so that the
#   project still has a model that can be. Do not merge the two.
#
# TOKEN BUDGET — WRITTEN FOR A CORPUS WE DID NOT HAVE, WHICH HAS SINCE ARRIVED
#   52.07M parameters wants 1.04B training tokens at 20:1, which is 260M
#   unique tokens at four epochs.
#
#   When this recipe was written Track B held 182.4M, so four epochs gave 730M
#   tokens — 14.0 per parameter, undertrained. It was still written at 4.0,
#   because epochs mean the same thing at any corpus size and that is the
#   entire reason this project states recipes in epochs rather than steps: as
#   the amber sources land, the same recipe trains the same model correctly,
#   with no edit.
#
#   That is what happened. Track B now holds 263,542,144 training tokens
#   (measured through the 4k vocabulary by src/token_growth.py, not
#   projected), so four epochs is 1.054B tokens — 20.2 per parameter. The
#   recipe did not change; the corpus grew into it, and the workaround this
#   note used to offer — raise phase one to 5.7 epochs for a one-off run — is
#   no longer needed.
#
# BATCH SIZE, NOW MEASURED
#   40 steps at batch 8 took 48 seconds. The same 40 steps at batch 16 had not
#   finished after seven minutes. That is the collapse LATIN-XXV recorded at
#   dim 512, arriving earlier here because the model is larger: not gradual
#   degradation but a cliff, once the working set stops fitting 16GB.
#
#   Watch the machine's free memory, not the process's RSS. MLX allocates
#   unified memory, which `ps` does not attribute to the process, so a
#   thrashing run looks like 0.1 GB at 11% CPU — starved rather than greedy.
#   Two probes were misread that way here before the cause was found.

name: latin-lii
description: 52.07M parameters, all Latin including NonCommercial sources, era-tagged.
# Single phase: see the note below on why the classical narrowing phase was removed.

defaults:
  vocab: 4000
  dim: 640
  layers: 10
  heads: 10
  context: 512
  batch: 8
  eval_every: 500
  checkpoint_every: 1000
  period_tags: true

# WHY THERE IS NO ROMANITAS PHASE HERE, THOUGH LATIN-XXV HAS ONE
#   It was tried and it made the model worse at the thing it was for.
#   Measured on the same held-out sets, through the same vocabulary:
#
#                          on classical   on corpus-b
#     after latinitas             27.3          21.3
#     after romanitas             30.2          32.5
#
#   LATIN-XXV-2 at 27.5M parameters gets the opposite result — 34.8 -> 28.3 on
#   classical — so the phase is not wrong in itself. It has a capacity ceiling,
#   and 52M is past it.
#
#   The cause is arithmetic. classical.train is a SUBSET of corpus.train, so
#   the phase introduces no new text; it only re-weights toward 4% of what the
#   model has already read. At 27.5M there is still something to learn from
#   that. At 52M there is not: 10.7M tokens against 52M parameters is 0.4
#   tokens per parameter, fifty times short of what the weights can absorb, so
#   the model memorises instead. The train/validation gap went from 0.138 to
#   0.484 while held-out perplexity got worse.
#
#   Do not re-add this phase for a model this size. A genuine narrowing phase
#   would need classical text HELD OUT of phase one — otherwise it is
#   re-reading, not transfer, which is the confound feasibility.md suspected
#   and this measures.

phases:
  # Latinitas — fifteen centuries of Latin, every document era-tagged so the
  # period is a thing the model can be asked for rather than a thing it has
  # to infer. 27.0% of the corpus is still UNASSIGNED and carries no tag at
  # all -- down from 42% before the Corpus Corporum rebuild, which dated a
  # large share of what had been undated. Improving the rest is still worth
  # more to conditioned generation than the next ten million words are.
  #
  # Measured coverage of corpus-b.train, by words:
  #   MEDIEVAL 31.9%   UNASSIGNED 27.0%   LATE 21.6%
  #   NEOLATIN 15.3%   CLASSICAL   4.2%
  #
  # CLASSICAL being 4.2% is why the classical annealing phase had so little to
  # narrow onto, and the UNASSIGNED share is the likeliest cause of the
  # MEDIEVAL-into-LATE confusion demos/aetas.py measures.
  - name: latin-lii
    corpus: corpus-b
    epochs: 4.0          # the line past which repeated data stops paying
    lr: 2.5e-4
    warmup: 1000
