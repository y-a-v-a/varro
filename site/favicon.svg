      .plate { fill: #1c1813; stroke: #efe5cf; }
      .c { stroke: #e27a60; }
    }
  </style>
  <!-- a tabula ansata, with an inscriptional V -->
  <path class="plate" stroke-width="3" stroke-linejoin="miter"
