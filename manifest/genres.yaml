# ===========================================================================
# Form and genre authority
# ===========================================================================
#
# Period tells you when a text was written and nothing about what it is. Plautus
# and the Digesta share a language and almost nothing else, and a single
# perplexity number averaged over both says very little. Evaluation results are
# far more informative sliced by register than by century.
#
# WHY THIS IS CURATED RATHER THAN INFERRED
#   Line structure looked like a free signal for verse — verse lines are short.
#   Measured, it is not: Livy, Tacitus, Augustine and Pliny all score like verse
#   (median 8-9 words per line, >0.9 short lines) because their sources encode
#   prose line-by-line, while Caesar and Cicero look like prose only because
#   Perseus encodes them in paragraphs. The signal reports the ENCODING, not the
#   text. So form is curated, like dates.
#
# TWO AXES, deliberately orthogonal
#   form   how it is written   VERSE | PROSE | PROSIMETRUM | UNKNOWN
#   genre  what it is          see `genres` below
#   Terentianus Maurus writes grammar in verse; Boethius and Petronius alternate
#   verse and prose within one work. One combined field cannot express either.
#
# RESOLUTION, most specific first
#   1. works[]          exact work title
#   2. title_patterns[] regex on the title — does most of the work, because the
#                       large authors are polygeneric and the title is reliable
#   3. authors[]        author default, for the monogeneric majority
#   4. UNKNOWN          recorded as such, never guessed
# ===========================================================================

version: 1

forms: [VERSE, PROSE, PROSIMETRUM, UNKNOWN]

genres:
  # verse-leaning
  - EPIC          # narrative hexameter, incl. biblical epic
  - DRAMA         # comedy and tragedy
  - LYRIC         # odes, hymns, occasional verse
  - ELEGY
  - SATIRE
  - EPIGRAM
  - DIDACTIC      # instructional verse
  # prose
  - HISTORY
  - BIOGRAPHY
  - ORATORY
  - EPISTOLOGRAPHY
  - PHILOSOPHY
  - RHETORIC
  - GRAMMAR       # incl. lexicography and metrics
  - COMMENTARY    # incl. scriptural exegesis and scholia
  - TECHNICAL     # architecture, warfare, surveying, cookery, encyclopaedia
  - MEDICINE
  - AGRICULTURE
  - LAW
  - GEOGRAPHY     # incl. pilgrimage accounts
  - NOVEL
  - MISCELLANY    # Gellius, Macrobius, Isidore: deliberately heterogeneous
  # Christian prose
  - THEOLOGY
  - APOLOGETIC
  - HOMILETIC
  - HAGIOGRAPHY
  - LITURGY
  # non-literary
  - DOCUMENTARY   # inscriptions, papyri, charters
  # modern
  - SCHOLARSHIP   # philology about the texts: the CSEL editors' prefaces and
                  # prolegomena, arguing from manuscripts about a text they
                  # print. Latin, but written 1867-1934 and about Latin rather
                  # than of it, so it is neither COMMENTARY (which is ancient
                  # and scriptural here) nor any of the ancient prose genres.

# Applied before author defaults. Ordered: first match wins.
title_patterns:
  # First, because these titles name the work they introduce and would other-
  # wise be read as it: `Praefatio editoris in Epistulae Imperatorum` is not
  # epistolography, and a preface to a commentary is not a commentary. The
  # marker is set by csel_volume_records; `Praefatio in` alone would catch
  # Jerome's own prefaces to the biblical books.
  - {match: "^Praefatio editoris in ", genre: SCHOLARSHIP, form: PROSE}
  - {match: "^Epistul|^Epistol|^Letters|ad Atticum|ad Familiares|ad Quintum|ad Brutum|Epistula",
     genre: EPISTOLOGRAPHY, form: PROSE}
  - {match: "Panegyric", genre: ORATORY, form: PROSE}
  # `Philippic` unanchored matched Justin's Epitoma historiarum PHILIPPICARUM,
  # 60k words of history filed as oratory. Cicero's speeches are `Philippicae`.
  - {match: "^In [A-Z][a-z]+ (Verrem|Catilinam|Pisonem|Vatinium|Caecilium)|^Pro [A-Z]|^Philippicae",
     genre: ORATORY, form: PROSE}
  - {match: "Commentari|Explanatio|Expositio|Adnotatio|Scholia|Commenta |Quaestiones in|In .* (Prophetam|Psalmos|Euangelium|Genesim|Isaiam)",
     genre: COMMENTARY, form: PROSE}
  - {match: "^Ars |De arte|Institutiones grammatic|^De lingua|Grammatic|De metris|De orthographia|De compendiosa doctrina",
     genre: GRAMMAR, form: PROSE}
  - {match: "^Digesta|^Codex |Institutiones|Corpus iuris|Novellae|^Lex ",
     genre: LAW, form: PROSE,
     note: "Bare `Institutiones` also catches Iustiniani Institutiones, whose word
            order the earlier pattern missed. Quintilian's Institutio Oratoria is
            singular and caught as RHETORIC by work override first."}
  - {match: "^Vita |^Vitae |De uita|De Vita", genre: BIOGRAPHY, form: PROSE}
  - {match: "^Chronic|^Historia|Res Gestae|Ab urbe condita|Rerum gestarum",
     genre: HISTORY, form: PROSE}
  - {match: "Itinerar|Peregrinatio|De Locis", genre: GEOGRAPHY, form: PROSE}
  - {match: "Confessio|De ciuitate dei|De civitate dei|Contra |Aduersus |Adversus |De trinitate|De fide",
     genre: THEOLOGY, form: PROSE}
  - {match: "Sermo|Homili|Tractatus in", genre: HOMILETIC, form: PROSE}
  # `Passio` unanchored matched Caelius Aurelianus on chronic and acute DISEASES
  # (passiones = afflictions), filing 119k words of medicine as hagiography.
  - {match: "^Passio |^Passiones |Martyri", genre: HAGIOGRAPHY, form: PROSE}
  # De uiris illustribus is a title used by both Jerome (Christian literary
  # biography) and Ps.-Aurelius Victor (pagan Roman). Biography covers both.
  - {match: "De uiris illustribus|De viris illustribus", genre: BIOGRAPHY, form: PROSE}

