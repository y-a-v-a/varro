works:
  - {aliases: ["Metamorphoses"], form: VERSE, genre: EPIC}
  - {aliases: ["De consolatione philosophiae", "Philosophiae consolatio"],
     form: PROSIMETRUM, genre: PHILOSOPHY,
     note: "Alternating prose books and verse metra — the definitive prosimetrum."}
  - {aliases: ["Satyricon"], form: PROSIMETRUM, genre: NOVEL}
  - {aliases: ["De nuptiis Philologiae et Mercurii"], form: PROSIMETRUM, genre: TECHNICAL}
  - {aliases: ["Hercules Oetaeus", "Hercules furens", "Medea", "Thyestes", "Phaedra",
               "Oedipus", "Agamemnon", "Troades", "Phoenissae", "Octauia", "Octavia"],
     form: VERSE, genre: DRAMA,
     note: "Senecan tragedy — verse inside an otherwise prose author."}
  - {aliases: ["Satires", "Sermones", "Ars Poetica", "Epistulae (Horace)"],
     form: VERSE, genre: SATIRE, note: "Horace's hexameter works."}
  - {aliases: ["Panegyrici Latini"], form: PROSE, genre: ORATORY}
  - {aliases: ["Historia Augusta"], form: PROSE, genre: BIOGRAPHY,
     note: "A set of imperial lives; the title pattern would otherwise read it as history."}
  - {aliases: ["Facta et Dicta Memorabilia"], form: PROSE, genre: MISCELLANY,
     note: "Valerius Maximus' exempla collection."}
  - {aliases: ["Mythographus Vaticanus I", "Mythographus Vaticanus II",
               "Mythographus Vaticanus III"], form: PROSE, genre: MISCELLANY}
  - {aliases: ["Ephemeris belli troiani"], form: PROSE, genre: NOVEL,
     note: "Pseudo-eyewitness Trojan romance, not history."}
  - {aliases: ["Analytica posteriora Aristotelis latine uersa",
               "Analytica posteriora Aristotelis latine uersa (?)"],
     form: PROSE, genre: PHILOSOPHY}
  - {aliases: ["Periochae Liuii"], form: PROSE, genre: HISTORY}
