# ===========================================================================
# Author and work date authority
# ===========================================================================
#
# Assigns `approximate_date` and `period` per WORK rather than per source.
# Without this, every Perseus record is tagged CLASSICAL — which is wrong for
# 14.7% of it (822,468 words): Tertullian, Jerome, Ammianus, Boethius, Claudian,
# Prudentius, Ausonius, Minucius Felix and the Historia Augusta are late antique.
# It also cuts the other way: Gaius and Festus arrive via DigilibLT, whose prior
# is LATE, but are 2nd c. and therefore CLASSICAL.
#
# METHOD AND ITS LIMITS
#   `floruit` is a single integer year, negative for BC, chosen as a mid-career
#   anchor rather than a birth or death date. It exists to place an author on
#   one side of a period boundary, NOT to be cited as a scholarly date. Where
#   the floruit is genuinely disputed the entry carries confidence: low and a
#   note; those cases should be reviewed by someone with the reference works to
#   hand before the corpus is published.
#
#   `period` is DERIVED from floruit via the boundaries below, so the two can
#   never disagree. An entry may set `period` explicitly only when no floruit
#   can responsibly be given (corporate authors, undatable anonymous material).
#
# MATCHING
#   `aliases` are matched against the exact author strings the extractors emit,
#   case-insensitively. Exact matching is deliberate: fuzzy matching on names
#   like "Florus" vs "Florus, Lucius Annaeus" or "Boethius" vs "Boethius
#   (Anicius Manlius Seuerinus Boethius)" silently merges distinct people.
#
# PSEUDONYMOUS WORKS
#   Ps.-X is not X. Pseudonymous works are later than their claimed author,
#   usually by centuries, and are dated separately — never by inheritance.
# ===========================================================================

version: 1

# Period boundaries, by floruit. CLASSICAL ends at AD 200 to match the PHI
# scope used throughout plan.md and feasibility.md.
periods:
  CLASSICAL: {max: 200}
  LATE:      {min: 201, max: 600}
  MEDIEVAL:  {min: 601, max: 1400}
  NEOLATIN:  {min: 1401}

# Applied only where no author or work entry matches. Marked `inferred` in the
# output so its share stays visible and auditable.
source_priors:
  perseus-canonical-latinLit: null    # deliberately none: Perseus is mixed,
                                      # and guessing here is the bug this file exists to fix
  digiliblt: LATE                     # project scope is 2nd-7th c. AD
  opengreekandlatin-csel: LATE        # patristic, 2nd-7th c.

# ---------------------------------------------------------------------------
# Patrologia Latina volume -> approximate year
# ---------------------------------------------------------------------------
#
# Migne's PL is arranged chronologically by author death, Tertullian to
# Innocent III across 217 volumes, so a volume number dates a text without
# needing to know its author. On Latin Wikisource — which hosts the PL at scale
# — a volume is recoverable for 22% of pages, and it is the ONLY dating signal
# most of them carry.
#
# The mapping is anchored on the principal author of well-known volumes and
# interpolated between them. It is NOT linear: Migne gives Augustine sixteen
# volumes and the whole tenth century about six, so a straight line from
# volume 1 to 217 puts Jerome a century early. Dates from this method are
# recorded with confidence `inferred` and should never be cited as scholarship —
# they exist to place a text on the right side of a period boundary.

pl_volume_anchors:
  - {volume: 1,   year: 220,  who: Tertullian}
  - {volume: 4,   year: 258,  who: Cyprian}
  - {volume: 17,  year: 397,  who: Ambrose}
  - {volume: 30,  year: 420,  who: Jerome}
  - {volume: 47,  year: 430,  who: Augustine}
  - {volume: 64,  year: 524,  who: Boethius}
  - {volume: 70,  year: 585,  who: Cassiodorus}
  - {volume: 79,  year: 604,  who: Gregory the Great}
  - {volume: 84,  year: 636,  who: Isidore of Seville}
  - {volume: 95,  year: 735,  who: Bede}
  - {volume: 101, year: 804,  who: Alcuin}
  - {volume: 112, year: 856,  who: Rabanus Maurus}
  - {volume: 130, year: 900,  who: late Carolingian}
  - {volume: 139, year: 1000, who: turn of the millennium}
  - {volume: 151, year: 1100, who: eleventh century}
  - {volume: 180, year: 1150, who: twelfth century}
  - {volume: 217, year: 1216, who: Innocent III}

