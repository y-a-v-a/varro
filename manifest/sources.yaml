# ===========================================================================
# Open Latin Corpus — source manifest
# ===========================================================================
#
# This file is the authoritative record of what enters the corpus and under
# what licence. `src/fetch.py` consumes it; `manifest/fetch.lock.json` records
# what was actually retrieved (resolved commit SHAs, checksums, timestamps);
# `src/provenance.py` turns it into the attribution notice and audits builds
# against it.
#
# TWO TRACKS
#   The project runs two corpora from one pipeline, because "may I train on
#   this?" and "may I redistribute this?" are different questions with
#   different answers.
#
#   Track A — REDISTRIBUTABLE. Free-licence sources only. This is the corpus
#     and the weights that get published. It is the contribution: a properly
#     licensed Latin corpus does not currently exist.
#
#   Track B — RESEARCH ONLY. Adds non-commercial sources. Never redistributed;
#     results, code and provenance are published instead. Roughly an order of
#     magnitude larger, which is what makes a ~100M-parameter model possible.
#     Depends on a non-commercial research framing — and in the EU, on the
#     TDM exceptions in Directive 2019/790 Art. 3/4, which permit mining for
#     scientific research on lawfully accessed works but do NOT permit
#     redistributing the corpus. See feasibility.md §3.
#
# tier — a licence class. Track membership is derived from it, never set by hand.
#   green    free licence or public domain      -> Track A and Track B
#   amber    non-commercial, terms known        -> Track B only
#   unknown  licence unresolved                 -> neither, until settled
#   eval     held-out evaluation data           -> its own track; never pretrained on
#
# include — whether the source is wanted at all. An amber source with
#   include:true is CORRECT: it means "wanted, in Track B". The guard that
#   matters is that no amber source reaches a Track A build, and that is
#   enforced in code (fetch.py, build.py, provenance.py --check), not here.
#
# period:   CLASSICAL | LATE | MEDIEVAL | NEOLATIN | MIXED | DOCUMENTARY
# est_words are rough planning figures, not measurements.
#
# PROVENANCE IS A STANDING OBLIGATION, not a release-time chore. Every build
# records which sources it drew on, under which licence, in what proportion.
# Run `python src/provenance.py --check` after any change to this file.
# ===========================================================================

version: 1
normalization_target: v1

sources:

  # -------------------------------------------------------------------------
  # GREEN — literary backbone
  # -------------------------------------------------------------------------

  - id: perseus-canonical-latinLit
    name: Perseus Digital Library — canonical Latin literature
    url: https://github.com/PerseusDL/canonical-latinLit
    method: git
    pin: null              # resolved and recorded in fetch.lock.json on first fetch
    license: CC-BY-SA-4.0
    tier: green
    include: true
    format: tei-capitains
    text_provenance: transcribed    # curated digital editions, human-keyed
    period: CLASSICAL
    lang_filter: lat       # repo also ships English translations — filter on @xml:lang
    est_words: 6000000
    notes: >
      Primary backbone. Best-curated free classical set, CTS/CapiTainS structure.
      Contains English translation files in the same tree; extraction MUST filter
      on the TEI @xml:lang attribute, not on file path.

  - id: latin-library
    name: The Latin Library (CLTK mirror)
    url: https://github.com/cltk/lat_text_latin_library
    method: git
    pin: null
    license: public-domain
    tier: green
    include: true
    format: txt
    text_provenance: unknown    # sources.md: inconsistent provenance, known OCR/typing errors
    period: MIXED
    lang_filter: lat
    est_words: 15000000
    notes: >
      Volume fill, ~108 MB. Spans archaic to modern — must be filtered to the
      target window by author. No critical apparatus; known transcription errors.
      Inline structural noise (section numbers, headers) needs stripping.
      Heavily overlaps Perseus: dedupe is mandatory, not optional.

  - id: gutenberg-latin
    name: Project Gutenberg — Latin
    url: https://www.gutenberg.org/browse/languages/la
    method: manual
    pin: null
    license: public-domain
    tier: green
    include: true
    format: txt
    text_provenance: transcribed    # Distributed Proofreaders; sources.md notes it is proofread, not OCR
    period: MIXED
    lang_filter: lat
    est_words: 500000
    notes: >
      Cleanest licence in the project — US public domain, no attribution or
      ShareAlike obligation. Human-proofread rather than OCR'd, so preferable
      wherever it overlaps a text that would otherwise need OCR.
      MANUAL: the `la` language tag also catches English translations, bilingual
      editions and English-language grammars. Requires per-title triage.
      Strip PG header/footer boilerplate (modern English) before ingestion.

  # -------------------------------------------------------------------------
  # GREEN — late antique (in scope for Latin-2 historical corpus only)
  # -------------------------------------------------------------------------

  - id: digiliblt
    name: DigilibLT — Digital Library of Late-Antique Latin Texts
    url: https://github.com/CIRCSE/digilibLT
    method: git
    pin: null
    license: CC-BY-SA-4.0
    tier: green
    include: true
    format: conllu
    text_provenance: transcribed    # digital library of edited texts
    period: LATE
    lang_filter: lat
    est_words: 4000000
    notes: >
      373 secular Latin prose texts, 2nd-7th c. AD. The 2nd-century material
      overlaps the tail of the classical window; the rest is Latin-2 Phase 1
      (Latinitas) data. Upstream site requires a free account; this CIRCSE
      mirror does not.

      FORMAT: this mirror is NOT the TEI source. It holds UDPipe-annotated
      CoNLL-U (in conllu/*.tar.gz) and LiLa RDF (ttl/). The running text is
      recoverable from the `# text =` header lines.

      LICENCE, resolved: the CIRCSE README is self-contradictory — its CC badge
      image links to BY-NC-SA 3.0 while the anchor text states the texts are
      CC BY-SA 4.0. The upstream DigilibLT project confirms CC BY-SA 4.0 for the
      TEXTS; the NC 3.0 applies to site chrome / the annotation layer.
      Accordingly the extractor takes ONLY the text layer and never the LiLa
      lemma/POS/URI annotations, which keeps this source unambiguously CC BY-SA 4.0.
      Do not start ingesting the annotation columns without revisiting this.

  - id: opengreekandlatin-csel
    name: Corpus Scriptorum Ecclesiasticorum Latinorum (Open Greek and Latin)
    url: https://github.com/OpenGreekAndLatin/csel-dev
    method: git
    pin: null
    license: CC-BY-SA-4.0
    tier: green
    include: true
    format: tei-capitains
    text_provenance: ocr    # the manifest's own note: machine-corrected OCR of CSEL volumes
    period: LATE
    lang_filter: lat
    est_words: 5000000
    notes: >
      Machine-corrected OCR of public-domain CSEL volumes (Latin Church Fathers).
      Outside strict classical scope; Latin-2 Phase 1 only. OCR quality varies —
      worth a spot-check pass before trusting it.

  # -------------------------------------------------------------------------
  # GREEN — documentary and epigraphic
  # (register diversity no literary corpus has: military records, letters,
  #  tombstones, graffiti, legal formulae)
  # -------------------------------------------------------------------------

  - id: edh
    name: Epigraphic Database Heidelberg
    url: https://github.com/epigraphic-database-heidelberg/data
    method: git
    pin: null
    license: CC-BY-SA-4.0
    tier: green
    include: true
    format: epidoc-xml
    text_provenance: transcribed    # epigraphic database, human-entered readings
    period: DOCUMENTARY
    lang_filter: lat
    est_words: 2000000
    notes: >
      Latin and Latin-Greek inscriptions of the Roman Empire. Bilingual entries
      need the Greek stripped or tagged (see feasibility.md §4.3).
      Heavy abbreviation and editorial restoration brackets — decide a policy for
      expanded vs. unexpanded forms before ingestion.

  - id: edcs-sdam
    name: EDCS Latin inscriptions — cleaned dataset (SDAM, Aarhus)
    url: https://zenodo.org/records/7072337
    method: zenodo
    pin: "7072337"
    license: CC-BY-4.0
    tier: green
    include: true
    format: edcs-json
    text_provenance: transcribed    # epigraphic database, human-entered readings
    period: DOCUMENTARY
    lang_filter: lat
    est_words: 3000000
    notes: >
      537,262 inscriptions, cleaned and streamlined from the Epigraphik-Datenbank
      Clauss/Slaby. This Zenodo dump is the licence-clean route to EDCS content —
      do NOT scrape the live database. Substantial overlap with EDH; dedupe.

  - id: papyri-idp
    name: Papyri.info / Duke Databank of Documentary Papyri
    url: https://github.com/papyri/idp.data
    method: git
    pin: null
    license: CC-BY-3.0
    tier: green
    include: true
    format: epidoc-xml
    text_provenance: transcribed    # editorial transcriptions of documentary papyri
    period: DOCUMENTARY
    lang_filter: lat
    est_words: 500000
    notes: >
      LARGE repository (multi-GB) and predominantly Greek — the Latin subset is
      small but valuable, being genuine documentary prose. Fetch uses a partial
      clone; extraction must filter hard on language before anything else.

  # -------------------------------------------------------------------------
  # GREEN — free-text corpora
  # -------------------------------------------------------------------------

  - id: vicifons
    name: Latin Wikisource (Vicifons)
    url: https://dumps.wikimedia.org/lawikisource/latest/lawikisource-latest-pages-articles.xml.bz2
    method: http
    pin: latest            # set to a dated dump path for full reproducibility
    license: CC-BY-SA-4.0
    tier: green
    include: true
    format: mediawiki-xml
    text_provenance: transcribed    # Wikisource: human-typed and proofread
    period: MIXED
    lang_filter: lat
    est_words: 3000000
    notes: >
      Indexed by century, which makes period assignment easy. MediaWiki markup,
      templates and transclusions must be stripped. `pin: latest` is NOT
      reproducible — replace with a dated dump directory before a published build.

  - id: latinise
    name: LatinISE (lemmatised Latin corpus)
    url: https://lindat.mff.cuni.cz/repository/xmlui/handle/11234/1-2506
    method: manual
    pin: null
    license: CC-BY-SA-4.0
    tier: green
    include: false
    format: txt
    text_provenance: unknown    # not established
    period: MIXED
    lang_filter: lat
    est_words: 9900000
    notes: >
      MANUAL download from LINDAT. include:false by default because it is
      substantially DERIVED from LacusCurtius, IntraText and Musisque Deoque —
      ingesting it alongside the backbone risks duplicating texts under a
      different surface form. Useful mainly as a lemmatised reference for
      evaluating our own normalisation. Enable only after dedup is proven.

  # -------------------------------------------------------------------------
  # EVAL — never mixed into pretraining
  # -------------------------------------------------------------------------

  - id: ud-latin-perseus
    name: Universal Dependencies — Latin-Perseus treebank
    url: https://github.com/UniversalDependencies/UD_Latin-Perseus
    method: git
    pin: null
    license: CC-BY-NC-SA-4.0
    tier: eval
    include: true
    format: conllu
    text_provenance: transcribed    # gold-standard treebank
    period: CLASSICAL
    lang_filter: lat
    est_words: 30000
    notes: >
      Gold-standard syntactic annotation, for probing only. NC licence is
      acceptable here because evaluation data is not redistributed as part of
      the corpus. CRITICAL: its underlying text overlaps Perseus — exclude those
      passages from training or the probe is meaningless.

  - id: ud-latin-proiel
    name: Universal Dependencies — Latin-PROIEL treebank
    url: https://github.com/UniversalDependencies/UD_Latin-PROIEL
    method: git
    pin: null
    license: CC-BY-NC-SA-3.0
    tier: eval
    include: true
    format: conllu
    text_provenance: transcribed    # gold-standard treebank
    period: CLASSICAL
    lang_filter: lat
    est_words: 200000
    notes: >
      Caesar, Cicero's letters, Palladius, Vulgate NT. Same overlap caveat as
      ud-latin-perseus. Verify the exact licence in the repo before use.

  # -------------------------------------------------------------------------
  # AMBER — Track B only. Non-commercial terms, known and accepted.
  # These are fetched for research builds and NEVER enter a Track A build or
  # any redistributed artifact. `restriction` records why.
  # -------------------------------------------------------------------------

  - id: corpus-corporum
    name: Corpus Corporum (University of Zurich)
    url: https://www.mlat.uzh.ch/
    method: corpus-corporum
    pin: null
    # One zipped TEI file per work. 20s between requests because this is a
    # small university server and there is no bulk export to ask it for.
    url_template: https://mlat.uzh.ch/php_modules/download.php?type=file-pos-xml&idno={idno}
    id_source: https://raw.githubusercontent.com/CCS-ZCU/corpus-corporum/master/data/cc_metadata.csv
    delay_seconds: 20
    # Excluded on the ASSUMPTION that the corpus already holds this text, and
    # that re-acquiring it would triple the run for nothing. digilibLT is a
    # source in its own right, so that one is certain. Patrologia Latina is
    # not: it is 5,248 works and 118M words here against the ~66M we carry via
    # Vicifons, and that gap of ~52M words is unexplained. It could be a fuller
    # edition, a different way of counting, or text we simply do not hold.
    #
    # NOT MEASURED. A containment check would settle it and has never been run.
    # It stays unrun deliberately: the only action it could justify is
    # including these works, which changes the corpus and so requires
    # retraining both models. Until someone wants that, the assumption is
    # cheaper than the answer -- but it is an assumption, and this comment says
    # so rather than implying the exclusion was verified.
    #
    # Everything else is fetched: 2,446 works, ~113M words, ~14 hours.
    exclude_series:
      - 'Patrologia\s+Latina'
      - 'digilibLT'
    license: NonCommercial
    tier: amber
    include: true
    format: tei-xml
    text_provenance: unknown    # heterogeneous origin, not established per text
    period: MIXED
    est_words: 226000000
    restriction: >
      Non-commercial use only. Quoted from the site's own About page: "The data
      we transcribed ourselves ... is published under Creative Commons
      Share-Alike and may thus be reused freely (but non-commercially) as long
      as the source is indicated. Most of the texts present here, however, stem
      from various online sources. As far as we could determine they are either
      in the public domain or their use was granted us by their owners." Also:
      "Texts may be downloaded as TEI xml for non-commercial use."
      robots.txt is `User-agent: * / Allow: /` — nothing forbids access.

      SELECT BY CORPUS NUMBER, DO NOT INGEST WHOLE. The browser lists all 30
      corpora with word counts, totalling 226,311,326. Three are sources we
      already hold and must be excluded by number, not left to dedupe:
      Perseus is corpus 5, OpenGreekAndLatin is 2 and 19, digilibLT is 16.
      Corpus 99 (Graeca miscellanea, 10.8M) is GREEK. Corpus 2 (Patrologia
      Latina, 85.5M) overlaps the ~66M of PL we already carry via Vicifons.
      Excluding those leaves ~115.9M words of largely-new medieval and
      neo-Latin — Acta Sanctorum alone is 52.7M.

    notes: >
      READER EXISTS AND IS TESTED (`tei-xml`). It was written against real
      files: the Patrologia Latina feed at
      github.com/OpenGreekAndLatin/patrologia_latina-dev, whose filenames carry
      a literal `[CC]` prefix because they ARE the Corpus Corporum copies.
      Those files also declare CC BY-SA 4.0 in their own teiHeader, so at least
      that constituent is greener than the platform's blanket NC term.

      Two defects measured there, both repaired in the reader, because a
      reader that ignores them looks like it works:
        - 5 of 21 files in one volume are not well-formed XML. All the same
          fault: unterminated character references (`&#171 ;`, `&gt5`,
          `&#0160`). Without repair they arrive as a parse_errors counter.
        - 4.06% of all words are split across a printed line
          (`Victo-\nrina`). At PL's scale that is ~3.5M broken tokens.
      Together: one volume went from 50,980 words to 218,818.

      ACQUISITION IS NOW MECHANISABLE, which it was not when this entry was
      first written. Two things closed the gap, both found via
      github.com/CCS-ZCU/corpus-corporum (Vojtěch Kaše, CCS Plzeň, CC BY-SA 4.0):
        - the per-work endpoint
            https://mlat.uzh.ch/php_modules/download.php?type=file-pos-xml&idno=<id>
          which returns a zipped TEI file. Verified: idno 10045 gives
          144_Petrus-Damianus_Epistolae.POS.xml.zip, 1.18 MB, HTTP 200.
        - data/cc_metadata.csv in that repo: 7,819 works with work_id, title,
          author, year / not_before / not_after (70.4% dated), word_count,
          series title, edition, editor, publisher and VIAF ids. That is both
          the id list to iterate and a dating layer better than anything we
          could infer.

      It is still `method: manual`, deliberately. 7,819 requests against a
      small university server is an imposition whatever robots.txt permits,
      and the courteous move remains an email to turicense@gmail.com — now
      asking to confirm a rate-limited pull rather than asking them to build
      an export. If they decline or do not answer, the fallback is the
      endpoint above with a real delay between requests.

      THE EXPORT CARRIES A POS LAYER THAT SHADOWS THE TEXT. Each word appears
      twice: once tokenised in the mlat.uzh.ch/2.0 namespace
      (`<cc:s><cc:w>LIBER</cc:w><cc:w>PRIMUS</cc:w></cc:s>`) and then again as
      running text (`LIBER PRIMUS.`). Measured on Petrus Damianus, Epistolae:
      a naive walk gives 226,051 words against a true 113,622 — every word in
      the corpus doubled. The reader strips the annotation and keeps the plain
      text, which is the readable form; the tokenised copy loses punctuation
      and capitalisation.

      Its headers are also much richer than the GitHub feed's:
      `<author>Petrus Damianus<date>1007-1072</date></author>` and
      `<seriesStmt><title>Patrologia Latina, vol. 144</title>`. The reader uses
      the lifespan midpoint as a `source-metadata` date and reads the PL volume
      from the series statement. It still ignores the header's own <date>,
      which is the printing — 1853, meaning Migne, not Petrus Damianus.

  - id: lasla
    name: LASLA / Opera Latina
    url: https://github.com/CIRCSE/LASLA
    method: git
    pin: null
    license: CC-BY-NC-SA-4.0
    tier: amber
    include: true
    format: lasla-conllup
    # The CIRCSE mirror publishes the corpus as CoNLL-U Plus, one file per
    # book, under the same CC BY-NC-SA 4.0 the LASLA site states — checked
    # against the repository's own README rather than inferred. That makes it
    # fetchable, which is why this entry no longer says `method: manual`.
    text_provenance: transcribed    # manually verified lemmatisation implies keyed text
    period: CLASSICAL
    est_words: 1630825
    restriction: >
      CC BY-NC-SA 4.0. The highest-quality manually verified annotated classical
      Latin in existence (154 works, 19 authors, morphology checked by hand).
      Valuable twice over in Track B: as training data, and as the gold standard
      for morphological evaluation — and evaluation data is never redistributed,
      so NC costs nothing there.

  - id: intratext
    name: IntraText — Bibliotheca Latina
    url: https://www.intratext.com/LAT/
    method: manual
    pin: null
    license: CC-BY-NC-SA-3.0
    tier: amber
    include: false
    format: html
    text_provenance: unknown    # not established
    period: MIXED
    est_words: 10000000
    restriction: >
      BLOCKED BY ACCESS TERMS, NOT BY LICENCE — the two are separate questions
      and this source is the case that shows why.

      The licence is fine for our purposes: CC BY-NC-SA 3.0 is amber, Track B
      never redistributes, and Track B's framing already rests on the research
      exception. Nothing in the licence stops us mining it.

      The site's access terms do. robots.txt disallows /Dwnld/ and denies
      roughly 25 named mirroring agents outright — Wget, HTTrack, WebZIP and
      the rest — and the copyright page asks that readers "link to the
      contents in The IntraText Digital Library itself" rather than republish
      them. Whatever a user-agent string not on that list would technically be
      permitted to do, the publisher's intent is not ambiguous, and this
      project honours licences and terms as offered rather than as argued.

      include:false accordingly. This is not a permanent no: it is 716
      IntraTexts / 876 works held by EuloTech SRL, and the way in is to ask
      them for a dataset, exactly as with the LTA/BBAW question. Do not write
      an HTML scraper for it in the meantime.

      Also note, before spending effort on the ask: substantially derived from
      other collections. Tesserae was measured at 95% already-present, and
      that is the closest comparison we have.

  - id: tesserae
    name: Tesserae Latin corpus
    url: https://github.com/cltk/lat_text_tesserae
    method: git
    pin: null
    license: UB-Public-License-1.0
    tier: green
    include: true
    format: tess
    text_provenance: unknown    # aggregated from other collections
    period: MIXED
    est_words: 8000000
    notes: >
      The licence has now been read, which is what moved this from `unknown`
      to green. UB Public License 1.0 (https://cse.buffalo.edu/sneps/ubpl.pdf)
      is a Mozilla Public License 1.1 derivative: §2.1 grants a "world-wide,
      royalty-free, non-exclusive license ... to use, reproduce, modify,
      display, perform, sublicense and distribute", and the words
      "non-commercial", "research only" and "academic use only" do not appear
      anywhere in it. §3.1 is file-level copyleft — redistribute the source
      form under the same licence and ship a copy of the licence with it.
      So: redistributable, commercially usable, ShareAlike-like per file.
      Obligation is closer to CC BY-SA than to anything in the amber tier.

      Dates: metadata/metadata.json gives an integer year and a prose/verse
      mode for every one of the 748 files. That is per-work evidence, better
      than the author-level floruits in authorities.yaml, and it is why
      Authority.resolve has a `source-metadata` rank.

      Expect heavy overlap — the corpus is largely DERIVED from Perseus and
      the Latin Library. It is included anyway because 69% of its files are
      classical, and classical is the one part of this corpus that cannot be
      grown by finding more sources.

  - id: musisque-deoque
    name: Musisque Deoque — Latin poetry with critical apparatus
    url: https://www.mqdq.it/
    method: manual
    pin: null
    license: unclear
    tier: unknown
    include: false
    format: tei-xml
    text_provenance: unknown    # not established
    period: CLASSICAL
    est_words: 4000000
    restriction: >
      Open access, but NO explicit licence is stated — which is `unknown`, not
      `amber`: silence is not permission, and it cannot be assumed either way.
      The complete corpus of ancient Latin poetry with critical apparatus, so
      this is the most valuable outstanding permission request in the project.
      Ask the project directly; until an answer arrives it enters neither track.
